version: '3.8'
services:
  nodeA:
    build: .
    container_name: node_a
    environment:
      # Unique ID for Node A
      NODE_ID: "nodeA"
      # Listening port for Node A
      LISTEN_PORT: "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "pgrep broker || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

  nodeB:
    build: .
    container_name: node_b
    environment:
      # Unique ID for Node B
      NODE_ID: "nodeB"
      # Listening port for Node B
      LISTEN_PORT: "8002"
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "pgrep broker || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

  nodeC:
    build: .
    container_name: node_c
    environment:
      # Unique ID for Node C
      NODE_ID: "nodeC"
      # Listening port for Node C
      LISTEN_PORT: "8003"
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "pgrep broker || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

# Volumes can be added here for persistent data storage if needed.
