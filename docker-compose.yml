version: '3.8'
services:
  nodeA:
    build: .
    container_name: node_a
    environment:
      # Unique ID for Node A
      NODE_ID: "nodeA"
      # Listening port for Node A
      PORT: "50051"
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "pgrep broker || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

  nodeB:
    build: .
    container_name: node_b
    environment:
      # Unique ID for Node B
      NODE_ID: "nodeB"
      # Listening port for Node B
      PORT: "50052"
    ports:
      - "50052:50052"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "pgrep broker || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

  nodeC:
    build: .
    container_name: node_c
    environment:
      # Unique ID for Node C
      NODE_ID: "nodeC"
      # Listening port for Node C
      PORT: "50053"
    ports:
      - "50053:50053"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "pgrep broker || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

# Volumes can be added here for persistent data storage if needed.